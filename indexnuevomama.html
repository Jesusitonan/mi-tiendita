<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Comunitario</title>
  <style>
    /* RESET & ESTILOS BÁSICOS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      padding-bottom: 80px;
    }

    /* ENCABEZADO */
    header {
      background-color: #1b4332;
      color: white;
      padding: 1rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 0.3rem;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    /* FILTROS DE CATEGORÍA */
    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 1rem;
      flex-wrap: wrap;
    }

    .cat-btn {
      background-color: #ffffff;
      border: 2px solid #1b4332;
      color: #1b4332;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .cat-btn.active, .cat-btn:hover {
      background-color: #1b4332;
      color: #ffffff;
    }

    /* CONTENEDOR DE PRODUCTOS */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }
 
    /* MODAL / PANTALLA EMERGENTE */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.85);
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

.modal-content {
  max-width: 90%;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 8px;
}

.close-modal {
  position: absolute;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 35px;
  font-weight: bold;
}
      
    /* TARJETA DE PRODUCTO */
/* NUEVO: EFECTO DE ZOOM EN IMÁGENES */
    .product-img-container {
      width: 100%;
    height: 200px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #ffffff;
    }

    .product-img {
      max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    transition: transform 0.3s ease;
    }

    /* Cuando el mouse pasa por encima (o se toca en móvil), la imagen crece un 40% */
    .product-card:hover .product-img {
      transform: scale(1.15);
    }

    .product-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #eee;
    }

    .product-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1.2rem;
      color: #2d6a4f;
      font-weight: bold;
      margin-top: auto;
      margin-bottom: 0.8rem;
    }

    .btn-add {
      background-color: #2b9348;
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background-color: #55a630;
    }

    /* BOTÓN FLOTANTE Y MODAL DE CARRITO */
    .cart-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: white;
      padding: 12px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 200;
    }

    .cart-count {
      background: white;
      color: #25d366;
      border-radius: 50%;
      padding: 2px 8px;
      font-size: 0.9rem;
    }

    /* MODAL DE PEDIDO */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 450px;
      border-radius: 10px;
      padding: 1.5rem;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      border-bottom: 1px dashed #eee;
      padding-bottom: 0.5rem;
    }

    .cart-controls button {
      background: #ddd;
      border: none;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .total-price {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: right;
      margin: 1rem 0;
    }

    .btn-send-ws {
      background-color: #25d366;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Catálogo de Pedidos</h1>
    <p>Haz tu pedido fácil y rápido por WhatsApp</p>
  </header>

  <!-- FILTROS POR CATEGORÍA -->
  <div class="categories">
    <button class="cat-btn active" onclick="filterCategory('todas')">Todas</button>
    <button class="cat-btn" onclick="filterCategory('celulares')">📱 Celulares</button>
    <button class="cat-btn" onclick="filterCategory('electro')">🔌 Electrodomésticos</button>
    <button class="cat-btn" onclick="filterCategory('accesorios')"> Accesorios</button>
  </div>

  <!-- CATÁLOGO -->
  <div class="container">
    <div class="products-grid" id="productsContainer"></div>
  </div>

  <!-- BOTÓN FLOTANTE DEL CARRITO -->
  <div class="cart-float" onclick="toggleCart()">
    🛒 Ver Pedido <span class="cart-count" id="cartCount">0</span>
  </div>

  <!-- MODAL / VENTANA DEL CARRITO -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Tu Pedido</h2>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
      </div>

      <div id="cartItemsContainer">
        <!-- Se llena con JS -->
      </div>

      <div class="total-price" id="totalPrice">Total: $0</div>

      <button class="btn-send-ws" onclick="sendWhatsApp()">📲 Enviar Pedido por WhatsApp</button>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN: NÚMERO DE WHATSAPP
    // Coloca tu número con clave de país (Ej: 52 + 10 dígitos)
    // ==========================================
    const TELEFONO_WHATSAPP = "529617714020";

    // BASE DE DATOS DE PRODUCTOS (10 por categoría)
    const products = [
      // CELULARES
      { id: 1, name: "Celular Motorola Moto G06 256gb ", category: "celulares", price: 3500, img: "https://http2.mlstatic.com/D_NQ_NP_2X_819589-MLA100977465205_122025-F.webp" },
      { id: 2, name: "Celular Samsung Galaxi A07 Verde 128gb ", category: "celulares", price: 2800, img: "https://http2.mlstatic.com/D_NQ_NP_2X_748593-MLA109945643128_042026-F.webp" },
      { id: 3, name: "Celular Xiaomi Redmi Note 14 5g 128gb ", category: "celulares", price: 4300, img: "https://http2.mlstatic.com/D_NQ_NP_2X_767423-CBT110923082160_052026-F-xiaomi-redmi-note-14-5g-8gb-128gb-negro-dual-sim-sistema-de-camara-ai-de-50mp-con-ois.webp" },
      { id: 4, name: "Celular Samsung Galaxi A16 5g 128gb ", category: "celulares", price: 3800, img: "https://http2.mlstatic.com/D_NQ_NP_2X_802041-MLA99444576642_112025-F.webp" },
      { id: 5, name: "Celular Xiaomi Poco C71 128gb ", category: "celulares", price: 3000, img: "https://http2.mlstatic.com/D_NQ_NP_2X_636989-CBT110031560298_042026-F-xiaomi-poco-c71-4gb-ram-128gb-rom-negro-pantalla-688-120hz-camara-32mp-bateria-5200mah-android-15.webp" },
      { id: 6, name: "Celular Motorola moto G56 256gb Azul oscuro", category: "celulares", price: 5100, img: "https://http2.mlstatic.com/D_NQ_NP_2X_884224-MLA96872588727_102025-F.webp" },
      

      // ELECTRODOMÉSTICOS
      { id: 7, name: "Ventilador Taurus Rush Ecojet 20 Silencioso 2 En 1", category: "electro", price: 1000, img: "https://http2.mlstatic.com/D_NQ_NP_2X_696799-MLA100690138492_122025-F.webp" },
      { id: 8, name: "Rca Dispensador De Agua Eléctrico Rc-wd2 Color Negro", category: "electro", price: 450, img: "https://http2.mlstatic.com/D_NQ_NP_2X_643777-MLA112008175785_052026-F.webp" },
      { id: 9, name: "Aspiradora de sólidos y líquidos TRUPER, 3 HP, 3 Galones", category: "electro", price: 1250, img: "https://http2.mlstatic.com/D_NQ_NP_2X_942530-MLA100036813149_122025-F.webp" },
      { id: 10, name: "Oster Cafetera, de 12 Tazas de Capacidad", category: "electro", price: 600, img: "https://http2.mlstatic.com/D_NQ_NP_2X_963719-MLA99942061095_112025-F.webp" },
      { id: 11, name: "Licuadora Oster de 2 Velocidades más Pulso Vaso de Vidrio Boroclass", category: "electro", price: 1100, img: "https://http2.mlstatic.com/D_NQ_NP_2X_613957-MLA114047590687_072026-F.webp" },
      { id: 12, name: "Ventilador De Pedestal Mytek 3392 De 18 Pulgadas Metalico", category: "electro", price: 1310, img: "https://http2.mlstatic.com/D_NQ_NP_2X_658448-MLA114496836451_072026-F.webp" },
      { id: 13, name: "Espejo Luz Led Touch Pared Tocador Baño Vestidor 3 Luces", category: "electro", price: 600, img: "https://http2.mlstatic.com/D_NQ_NP_2X_844366-MLM101921876481_122025-F.webp" },
      { id: 14, name: "Magma Life Set De 50 Ganchos De Terciopelo Para Ropa De Adulto Antideslizantes", category: "electro", price: 400, img: "https://http2.mlstatic.com/D_NQ_NP_2X_665490-MLA110654330854_052026-F.webp" },
      { id: 15, name: "Escurridor De Trastes Platos 2 Niveles", category: "electro", price: 550, img: "https://http2.mlstatic.com/D_NQ_NP_2X_940841-MLM114214176949_072026-F.webp" },
      { id: 16, name: "EPixar Figura De Acción Woody Parlante De 7 Pulgadas", category: "electro", price: 580, img: "https://http2.mlstatic.com/D_NQ_NP_2X_975653-MLA111032744174_052026-F.webp" },

      // BOTAS
      { id: 17, name: "Pack x5 Labiales Liquidos Matte Maybelline De Larga Duración Superstay Matte Ink", category: "accesorios", price: 1150, img: "https://http2.mlstatic.com/D_NQ_NP_2X_770662-MLA110430155373_042026-F.webp" },
      { id: 18, name: "Pack X6 Labiales Velvet Edición Limitada Yuya", category: "accesorios", price: 800, img: "https://http2.mlstatic.com/D_NQ_NP_2X_823585-MLU73884604129_012024-F.webp" },
      { id: 19, name: "Gimnasio Piano Musical Tapete De Juegos Para Bebés Pataditas", category: "accesorios", price: 450, img: "https://http2.mlstatic.com/D_NQ_NP_2X_679729-MLM112213168396_062026-F-gimnasio-piano-musical-tapete-de-juegos-para-bebes-pataditas.webp" },
      { id: 20, name: "Philips Avent Biberón natural response  color blanco  4 onzas  125 ml  paquete de 4 piezas Válvula anticólico", category: "accesorios", price: 680, img: "https://http2.mlstatic.com/D_NQ_NP_2X_902095-MLA99463965546_112025-F.webp" },
      { id: 21, name: "Audífonos In-ear Bluetooth Para Celulares, Tablets y Laptops, Conexión Automática, Resistente al Agua y Polvo", category: "accesorios", price: 225, img: "https://http2.mlstatic.com/D_NQ_NP_2X_851731-MLA100096823243_122025-F.webp" },
      { id: 22, name: "Ninzi® Bolso Bandolera Pequeño De Mujer En Color Liso Color Negro", category: "accesorios", price: 250, img: "https://http2.mlstatic.com/D_NQ_NP_2X_676718-MLA81089706219_122024-F.webp" },
      { id: 23, name: "Bolsa Bandolera Mujer Dama Crossbody Impermeable Multi Bolsillos Gran Capacidad Violeta", category: "accesorios", price: 300, img: "https://http2.mlstatic.com/D_NQ_NP_2X_748870-MLA112988120778_072026-F.webp" },
      { id: 24, name: "Set 6 Bolsas Mujer Estampado Cartera Moda Crossbody Tote Pu Color Blanco", category: "accesorios", price: 450, img: "https://http2.mlstatic.com/D_NQ_NP_2X_880201-MLA100008514075_122025-F.webp" },
      { id: 25, name: "Vanance® Gorra Sombrero Para El Sol Con Uv Proteccion Cuello Y Cara Ajustable Color Gris Oscuro Único Sombrero Para Hombre Exterior", category: "accesorios", price: 200, img: "https://http2.mlstatic.com/D_NQ_NP_2X_999803-MLA102137041124_122025-F.webp" },
      { id: 26, name: "Elástico Pantalón Larga Mujer Tenis Moda Casual Pantalones", category: "accesorios", price: 270, img: "https://http2.mlstatic.com/D_NQ_NP_2X_906764-MLM87136201146_072025-F-elastico-pantalon-larga-mujer-tenis-moda-casual-pantalones.webp" }
    ];

    let cart = {};

    // DIBUJAR PRODUCTOS
    function renderProducts(filter = 'todas') {
      const container = document.getElementById('productsContainer');
      container.innerHTML = '';

      const filtered = filter === 'todas' 
        ? products 
        : products.filter(p => p.category === filter);

      filtered.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
        <div class="product-img-container">
          <img src="${product.img}" alt="${product.name}" class="product-img" onclick="openModal('${product.img}')">
          </div>
          <div class="product-info">
            <div class="product-title">${product.name}</div>
            <div class="product-price">$${product.price.toLocaleString()} MXN</div>
            <button class="btn-add" onclick="addToCart(${product.id})">➕ Agregar</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // FILTRAR POR CATEGORÍA
    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderProducts(cat);
    }

    // AGREGAR AL CARRITO
    function addToCart(productId) {
      if (cart[productId]) {
        cart[productId].qty += 1;
      } else {
        const prod = products.find(p => p.id === productId);
        cart[productId] = { ...prod, qty: 1 };
      }
      updateCartUI();
    }

    // CAMBIAR CANTIDAD
    function changeQty(productId, delta) {
      if (cart[productId]) {
        cart[productId].qty += delta;
        if (cart[productId].qty <= 0) {
          delete cart[productId];
        }
      }
      updateCartUI();
    }

    // ACTUALIZAR INTERFAZ DEL CARRITO
    function updateCartUI() {
      const itemsContainer = document.getElementById('cartItemsContainer');
      itemsContainer.innerHTML = '';
      let total = 0;
      let totalItems = 0;

      const keys = Object.keys(cart);
      if (keys.length === 0) {
        itemsContainer.innerHTML = '<p style="text-align:center; color:#777;">El carrito está vacío.</p>';
      } else {
        keys.forEach(id => {
          const item = cart[id];
          const subtotal = item.price * item.qty;
          total += subtotal;
          totalItems += item.qty;

          const row = document.createElement('div');
          row.className = 'cart-item';
          row.innerHTML = `
            <div>
              <strong>${item.name}</strong><br>
              <small>$${item.price} c/u</small>
            </div>
            <div class="cart-controls">
              <button onclick="changeQty(${item.id}, -1)">-</button>
              <span style="margin: 0 5px;">${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          `;
          itemsContainer.appendChild(row);
        });
      }

      document.getElementById('cartCount').innerText = totalItems;
      document.getElementById('totalPrice').innerText = `Total: $${total.toLocaleString()} MXN`;
    }

    // MOSTRAR / OCULTAR MODAL
    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    // ENVIAR POR WHATSAPP
    function sendWhatsApp() {
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        alert("Agrega al menos un producto al carrito para realizar tu pedido.");
        return;
      }

      let message = "¡Hola! Quiero realizar el siguiente pedido:\n\n";
      let total = 0;

      keys.forEach(id => {
        const item = cart[id];
        const subtotal = item.price * item.qty;
        total += subtotal;
        message += `▪ ${item.qty}x ${item.name} - $${subtotal.toLocaleString()} MXN\n`;
      });

      message += `\n*Total a pagar:* $${total.toLocaleString()} MXN\n`;
      message += "\n¿Me confirmas disponibilidad y forma de entrega, por favor?";

      const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }
  
    // FUNCIONES PARA EL MODAL (Van dentro del script)
    function openModal(imgSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('imgFull');
      modal.style.display = 'flex';
      modalImg.src = imgSrc;
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }
      
    // INICIALIZAR
    renderProducts();
  </script>

  <!-- MODAL PARA VER IMAGEN COMPLETA -->
<div id="imageModal" class="modal" onclick="closeModal()">
  <span class="close-modal">&times;</span>
  <img class="modal-content" id="imgFull">
</div>
</body>
</html>
